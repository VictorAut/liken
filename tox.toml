# DEPENDENCY INTEGRATION MATRIX

# tests lowest backend version + lowest compatible python version
# and, highest backend version + highest compatible python version
# e.g. pandas 1.5.3 with py3.11; pandas 3 with py3.14


# PANDAS


[env.pandas-floor]
description = "pandas 1.5.3 | py3.11"
base_python = "3.11"
labels = ["matrix"]
setenv = { COVERAGE_FILE = ".coverage-{envname}" }
deps = ["pytest", "pytest-cov<7"]
commands_pre = [
    [
        "uv",
        "pip",
        "install",
        "--no-deps",
        "-e",
        ".",
    ],
    [
        "uv",
        "pip",
        "install",
        "pandas==1.5.3",
        "numpy<2",
        "polars==1.35.2",
        "pyarrow==23.0.1",
        "typing-extensions==4.15.0",
        "rapidfuzz==3.14.3",
        "scikit-learn==1.7.2",
        "sparse-dot-topn==1.1.5",
        "datasketch==1.8.0",
        "networkx==3.6.1",
        "faker==37.12.0",
        "catalogue==2.0.10",
        "nameparser==1.1.3",
        "cleanco==2.3",
        "nltk==3.9.3",
    ],
]
commands = [
    ["pytest", "tests/unit/", "-q", "--cov=liken", "--cov-append"],
    ["pytest", "tests/integration/", "--backend", "pandas", "-vv", "--cov=liken", "--cov-append"],
]

