# MINIMAL

[env_base.minimal]
description = "Run full test suite for all extras"
factors = [["3.11", "3.12", "3.13", "3.14"]]
deps = ["pytest"]
commands_pre = [["uv", "pip", "install", "-e", "."]] # i.e. "minimal"
commands = [
    [
        "pytest",
        "tests/extras/test_minimal.py",
        "-vv",
        "--confcutdir=tests/extras",
    ],
]

# ALL EXTRAS

[env_base.all]
description = "Run full test suite for all extras"
