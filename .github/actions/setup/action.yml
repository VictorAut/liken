name: "Setup project"
description: "Install Python, uv, task, and project"

inputs:
  python-version:
    required: true

runs:
  using: "composite"
  steps:
    - name: python | setup
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: uv | install
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.12.17"

    - name: task | install
      uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
      with:
        version: 3.48.0

    - name: liken | install
      run: |
        task install
      shell: bash
