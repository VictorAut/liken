name: "Setup project"
description: "Install Python, uv, task, and project"

inputs:
  python-version:
    required: true
  java-version:
    description: "JDK to pin for JVM-backed test lanes (pyspark floor pins old Spark/Hadoop)"
    required: false
    type: string
    default: "21"
  install-liken:
    description: "Run `task install` (lock-based install; skip on 3.15 lanes where tox installs fresh)"
    required: false
    type: boolean
    default: true

runs:
  using: "composite"
  steps:
    - name: python | setup
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: java | setup
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: uv | install
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.12.17"

    - name: task | install
      uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
      with:
        version: 3.48.0

    - name: liken | install
      if: ${{ inputs.install-liken == 'true' }}
      run: |
        task install
      shell: bash
