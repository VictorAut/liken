name: ⚙️ release | PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package | Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: python | setup
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: uv | install
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"

      - name: uv | build package wheel
        run: uv build

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/


  publish-to-testpypi:
    name: Package | Publish to TestPyPI
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: testpypi
      url: https://test.pypi.org/p/liken

    permissions:
      id-token: write # mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Package | Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') # only publish to PyPI with tags
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: pypi
      url: https://pypi.org/p/liken

    permissions:
      id-token: write # mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"

      - name: Publish to PyPI
        run: uv publish

  docs:
    name: Docs
    needs:
      - publish-to-pypi
    uses: ./.github/workflows/docs.yml
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      pages: write
      id-token: write # mandatory for trusted publishing
