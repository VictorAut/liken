name: ci

on:
  workflow_dispatch: # manual full run; escape hatch if a path filter misjudges
  workflow_call:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tox.toml"
      - "Taskfile.yml"
      - ".github/actions/setup/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14'

      - name: lint
        run: |
          task lint

  test-coverage:
    runs-on: ubuntu-latest
    needs: linting
    timeout-minutes: 45
    permissions:
      pull-requests: write

    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: tests | run
        run: |
          task coverage COV_FORMAT=xml

      - name: coverage | upload to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: true

      - name: tests | coverage
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: "coverage.xml"
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both

      - name: coverage | add header
        run: |
          echo "## Coverage Report" > coverage.md
          cat code-coverage-results.md >> coverage.md

      - name: tests | pr-comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ github.event_name == 'pull_request'}}
        with:
          header: Coverage Report
          hide_and_recreate: true
          path: coverage.md

  test-extras:
    runs-on: ubuntu-latest
    needs: test-coverage
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
        extras: [ "minimal", "all", "dask", "ray", "pyspark", "modin" ]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: test | optional imports
        run: |
          task test-extras EXTRAS=${{ matrix.extras }} PY_VERSION=${{ matrix.python-version }}
