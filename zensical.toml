[project]
site_name = "Liken"
site_url = "https://victoraut.github.io/liken/"
repo_name = "VictorAut/liken"
repo_url = "https://github.com/VictorAut/liken"
site_description = "Liken is a library providing enhanced deduplication tooling for DataFrames"
site_author = "Victor Autonell-Oiry"
copyright = "Victor Autonell-Oiry &copy; 2025 - 2026"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
    { "Liken" = "index.md" },
    { "Installation and Quick Start" = "installation-quick-start.md" },
    { "Tutorials" = [
        "tutorials/index.md",
        "tutorials/coming-from-pandas.md",
        "tutorials/first-steps.md",
        "tutorials/applying-dedupers.md",
        "tutorials/canonicalization.md",
        "tutorials/representative-records.md",
        "tutorials/custom-dedupers.md",
    ] },
    { "In Practice" = [
        "in-practice/index.md",
        "in-practice/common-recipes.md",
        "in-practice/iterative-workloads.md",
        "in-practice/choosing-a-deduper.md",
        "in-practice/backends.md",
        "in-practice/ai-agent-skills.md",
        "in-practice/performance.md",
    ] },
    { "API Reference" = [
        "reference/liken.md",
        "reference/preprocessors.md",
        "reference/custom.md",
        "reference/datasets.md",
    ] },
    { "About" = [
        "about/glossary.md",
        "about/release-history.md",
        "about/contributing.md",
        "about/license.md",
        { "PyPI ↗" = "https://pypi.org/project/liken/" },
        { "Github ↗" = "https://github.com/VictorAut/liken" }
    ] },
]

# THEME:

[project.theme]
logo = "images/favicon-transparent.png"
favicon = "images/favicon-transparent.png"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "navigation.indexes",
    "navigation.top",
    "navigation.tracking",
    "navigation.footer",
    "search.highlight",
]

[[project.theme.palette]]
primary = "custom"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
primary = "custom"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# LEGACY PLUGINS:

[project.plugins.markdown-exec]

# DOCSTRINGS:

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_symbol_type_heading = true
show_symbol_type_toc = true
show_object_full_path = true
show_docstring_type_aliases = true
show_root_toc_entry = true
show_root_full_path = true
filters = ["!^_"]

# MARKDOWN EXTENSIONS:

[project.markdown_extensions]
admonition = {}
pymdownx.caret = {}
def_list = {}
pymdownx.blocks.caption = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.highlight.line_spans = "__span"
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
